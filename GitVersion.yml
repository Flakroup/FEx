mode: ContinuousDeployment
# Lifts the pre-release line above 0.1.1. A build defect once packed a develop snapshot as the stable
# 0.1.1 and left a v0.1.1-alpha tag behind, which anchored every later alpha to 0.1.1-alpha.N - all of
# them ordering BELOW the published 0.1.1, so no consumer could ever resolve one. Removing the tag would
# drop the line further; only moving the base forward puts the alphas back on top.
next-version: 0.2.0
branches: {}
ignore:
  sha: []
merge-message-formats: {}
