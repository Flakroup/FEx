name: CI

# Branches other than main/develop are built by their pull_request run only: a push trigger on them ran
# a second build of the same commit in parallel. Version tags pushed by the Tag target never match the
# branch filter, so they trigger nothing. The gitleaks scan lives in secret-scan.yml and still runs on
# every branch push.
on:
  push:
    branches:
      - main
      - develop
  pull_request:

# Only pull_request runs are cancelled by a newer push. A push run (main/develop only) may be in the middle of publishing,
# and a job-level concurrency group cannot protect it from this workflow-level one: cancelling the run
# cancels every job in it. Push runs on one ref queue instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  # PR only: the full test suite under Coverage. Push to main/develop runs the same Coverage in the
  # `build` job below, which gates the packages `publish` ships, so it is not duplicated across two
  # jobs/checkouts.
  test:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Coverage runs the suite instrumented and fails below 100% outside build/CoverageDebt.cs.
      - name: Cover
        run: pwsh ./build.ps1 Coverage
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/test-results/*.trx
            artifacts/test-results/*.cobertura.xml
          if-no-files-found: ignore
          retention-days: 30

  # Push to main/develop, part 1 of 2: the long, flake-prone part (restore, compile, test, pack).
  # It pushes nothing - the packages go up as an artifact and the `publish` job below ships them in one go,
  # so a runner lost here leaves nothing on nuget.org. Mirrors the old .gitlab-ci.yml publish job
  # (push -> develop/main/master).
  build:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0   # GitVersion needs full history + tags
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # One Compile feeds both targets; Coverage (which runs Test) gates the Pack output.
      - name: Cover and pack
        run: pwsh ./build.ps1 Coverage Pack --configuration Release
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/packages/release-version.txt
          if-no-files-found: error   # an empty release must fail here, not get tagged by `publish`
          retention-days: 7
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/test-results/*.trx
            artifacts/test-results/*.cobertura.xml
          if-no-files-found: ignore
          retention-days: 30

  # Part 2 of 2: a short job that only pushes the packages `build` produced, all in one go, then tags.
  # Re-running just this job (Actions -> Re-run failed jobs) re-pushes from the retained artifact;
  # `--skip-duplicate` walks past what is already on the feed. The tag names the version Pack wrote
  # next to the packages (release-version.txt), so GitVersion is not resolved a second time here and a
  # re-run tags exactly what was packed. Own concurrency group so two publishes never push at once; a
  # running one is not cancelled by a follow-up push because the workflow-level group above only
  # cancels pull_request runs.
  publish:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: windows-latest
    environment: production
    concurrency:
      group: fex-publish
      cancel-in-progress: false
    permissions:
      contents: write   # allow the NUKE Tag target to push the version tag
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0   # GitVersion needs full history + tags
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages
      # Everything up to Pack already ran in `build`; skip it so this job only pushes and tags.
      - name: Publish to nuget.org
        env:
          NuGetApiKey: ${{ secrets.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # for the Tag target to push the git version tag
        run: |
          $version = (Get-Content artifacts/packages/release-version.txt -Raw).Trim()
          pwsh ./build.ps1 Publish --skip Restore Compile Test Coverage Verify Pack --configuration Release --release-version $version --nuget-source "https://api.nuget.org/v3/index.json"
      # The same packages to the internal Azure Artifacts feed, so consumers restoring from it get a new alpha without waiting for
      # nuget.org to index it. A plain push, not a second NUKE Publish (HEAD is tagged by now, so NUKE would push nothing).
      # After nuget.org and without continue-on-error: a feed outage cannot block the public release but still turns the job red.
      # Re-running the failed job is safe: NUKE skips nuget.org (tagged) and --skip-duplicate finishes what this feed lacks.
      # The runner is Windows, so NuGet keeps the source password DPAPI-encrypted (no --store-password-in-clear-text).
      # Backslashes in the push path: on Windows, dotnet nuget push expands the wildcard only in a backslash path.
      - name: Publish to Azure Artifacts (Flakroup feed)
        env:
          AZURE_ARTIFACTS_PAT: ${{ secrets.AZURE_ARTIFACTS_PAT }}
        run: |
          dotnet nuget add source "https://flakroup.pkgs.visualstudio.com/_packaging/Flakroup/nuget/v3/index.json" --name Flakroup --username az --password $env:AZURE_ARTIFACTS_PAT
          dotnet nuget push "artifacts\packages\*.nupkg" --source Flakroup --api-key az --skip-duplicate
