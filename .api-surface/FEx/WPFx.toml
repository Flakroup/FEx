[[classes]]
name = "GridDetailsView"
ns = "FEx.WPFx.Controls.VirtualizingWrapPanelControl"
base = "GridView"
summary = "Simple control that displays a gird of items. Depending on the orientation, the items are either stacked horizontally or vertically until the items are wrapped to the next row or column. The control is using virtualization to support large amount of items. If an item is clicked the item gots expanded until it is clicked again or an other item is clicked and gots expanded. In order to work properly all items must have the same size."
file = "Controls\\VirtualizingWrapPanelControl\\GridDetailsView.xaml.cs"

