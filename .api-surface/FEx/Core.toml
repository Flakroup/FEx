[project]
name = "FEx.Core"
path = "rc\\Core"

[[classes]]
name = "FExCoreModule"
ns = "FEx.Core"
base = "InitializeModule<IFExCoreContainer, IServiceCollection>"
file = "FExCoreModule.cs"

[[classes]]
name = "IsExternalInit"
ns = "System.Runtime.CompilerServices"
file = "IsExternalInit.cs"
static = true

[[classes]]
name = "ConcurrentHashSet"
ns = "FEx.Core.Collections.Concurrent"
base = "ISet<T>, IReadOnlyCollection<T>, IDisposable
#pragma warning restore IDISP025"
summary = "Thread-safe HashSet using composition with ReaderWriterLockSlim. https://stackoverflow.com/questions/18922985/concurrent-hashsett-in-net-framework"
file = "Collections\\Concurrent\\ConcurrentHashSet.cs"

[[classes]]
name = "ConcurrentObservableDictionary"
ns = "FEx.Core.Collections.Concurrent"
base = "BaseConcurrentList<KeyValuePair<TKey, TValue>>,
    IDictionary<TKey, TValue>, IDictionary, IReadOnlyDictionary<TKey, TValue>, INotifyCollectionChanged,
    INotifyPropertyChanged"
summary = "Based on https://github.com/ChadBurggraf/parallel-extensions-extras"
file = "Collections\\Concurrent\\ConcurrentObservableDictionary.cs"

[[classes]]
name = "ConcurrentObservableList"
ns = "FEx.Core.Collections.Concurrent"
base = "ConcurrentList<T>, IObservableCollection<T>"
file = "Collections\\Concurrent\\ConcurrentObservableList.cs"

[[classes]]
