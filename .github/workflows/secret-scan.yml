name: Secret scan

# Split out of ci.yml so it keeps running on EVERY branch push: ci.yml builds only main/develop pushes
# (a branch with a pull request is built by its pull_request run), and this public repository has no
# other secret detection. The job name stays `secret-scan` - it is a required status check.
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'   # version tags are pushed by the Tag target; the commit was already scanned
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: gitleaks
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo"
          zricethezav/gitleaks:latest
          detect --source /repo --no-git --no-banner -v
