[[classes]]
name = "DirectoryInfoEnumerationExtensions"
ns = "FEx.FileSystem"
summary = "Shim extension methods that allow the rest of the codebase (which expects ) to compile and work on older frameworks where that type does not exist (e.g. netstandard2.0/2.1). The implementation maps the subset of functionality that is possible to emulate via the existing overloads. Properties that have no equivalent are ignored."
