[[classes]]
name = "DirectoryWalker"
ns = "FEx.FileSystem"
file = "DirectoryWalker.cs"
static = true

[[extensions]]
name = "SafeGetAllFiles"
sig = "List<FileInfo> SafeGetAllFiles(this DirectoryInfo root,
                                                 FileFilterDelegate predicate = null,
                                                 string searchPattern = \"*\",
                                                 FExEnumerationOptions options = null,
                                                 DirectoryFilterDelegate skipDirectoryPredicate = null)"
returns = "List<FileInfo>"
summary = "Recursively gets all subdirectories from a root directory, ignoring any directories that throw an UnauthorizedAccessException or other IO exceptions."
file = "DirectoryWalker.cs"

