[project]
name = "FEx.SecureStorage"
path = "src\\FEx.SecureStorage"

[[classes]]
name = "FileSecureStorageService"
ns = "FEx.SecureStorage"
base = "ISecureStorageService"
summary = "Cross-platform fallback storage that persists values as encrypted files under ~/.fexStorage/ . Uses a per-user/per-machine cipher derived from {UserName}@{MachineName} . Not OS-level secure - prefer WindowsDpapiSecureStorageService , MacOsKeychainSecureStorageService or LinuxLibsecretSecureStorageService when available."
file = "FileSecureStorageService.cs"

[[ctors]]
parent = "FileSecureStorageService"
sig = "FileSecureStorageService()"
file = "FileSecureStorageService.cs"

[[ctors]]
parent = "FileSecureStorageService"
sig = "FileSecureStorageService(string cipher, DirectoryInfo storage)"
file = "FileSecureStorageService.cs"

[[methods]]
parent = "FileSecureStorageService"
name = "Get"
sig = "T Get<T>(string key)"
returns = "T"
file = "FileSecureStorageService.cs"

[[methods]]
parent = "FileSecureStorageService"
name = "Set"
sig = "void Set(string key, object content)"
returns = "void"
file = "FileSecureStorageService.cs"

[[interfaces]]
name = "ISecureStorageContainer"
ns = "FEx.SecureStorage"
base = "IContainer<ISecureStorageService>"
file = "ISecureStorageContainer.cs"

[[classes]]
name = "SecureStorageModule"
ns = "FEx.SecureStorage"
base = "InitializeModule<ISecureStorageContainer, IServiceCollection>"
file = "SecureStorageModule.cs"

[[methods]]
parent = "SecureStorageModule"
name = "CreateSecureStorageService"
sig = "static ISecureStorageService CreateSecureStorageService()"
returns = "ISecureStorageService"
summary = "Picks the most secure available on the current OS. Order: Windows DPAPI &gt; macOS Keychain &gt; Linux libsecret &gt; cross-platform file fallback. If libsecret is missing on Linux the factory silently falls back to the file implementation."
file = "SecureStorageModule.cs"
static = true

[[methods]]
parent = "SecureStorageModule"
name = "RegisterServices"
sig = "void RegisterServices(ISecureStorageContainer container, IServiceCollection services)"
returns = "void"
file = "SecureStorageModule.cs"

